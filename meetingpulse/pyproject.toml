[project]
name = "meetingpulse"
version = "0.1.0"
description = "FastMCP server that turns meeting notes into emails, calendar events, and overdue alerts"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "dateparser>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
